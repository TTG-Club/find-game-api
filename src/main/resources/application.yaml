spring:
  application:
    name: find-game-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/find_game}
    username: ${DB_USERNAME:find_game}
    password: ${DB_PASSWORD:find_game}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

springdoc:
  swagger-ui:
    path: /swagger-ui.html

auth-service:
  jwt-secret: ${AUTH_SERVICE_JWT_SECRET}
  base-url: ${AUTH_SERVICE_URL:http://localhost:8081}
  connect-timeout: ${AUTH_SERVICE_CONNECT_TIMEOUT:2s}
  read-timeout: ${AUTH_SERVICE_READ_TIMEOUT:3s}
  # Тот же секрет, что internal.service-secret у auth-service: им закрыта отправка писем.
  service-token: ${AUTH_SERVICE_INTERNAL_SECRET:}

subscriber-service:
  base-url: ${SUBSCRIBER_SERVICE_URL:http://localhost:8083}
  connect-timeout: ${SUBSCRIBER_SERVICE_CONNECT_TIMEOUT:2s}
  read-timeout: ${SUBSCRIBER_SERVICE_READ_TIMEOUT:3s}

server:
  # Resolve client addresses only through explicitly trusted proxies. Never trust arbitrary XFF.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: ${RATE_LIMIT_TRUSTED_PROXIES:(?!)}

rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  requests: ${RATE_LIMIT_REQUESTS:300}
  interval: ${RATE_LIMIT_INTERVAL:1m}
  max-clients: ${RATE_LIMIT_MAX_CLIENTS:100000}

internal:
  service-secret: ${INTERNAL_SERVICE_SECRET:}

# Брошенные игры: после idle-period без действий мастера ему задаётся вопрос
# «Игра ещё актуальна?», а после grace-period без ответа игра отменяется сама.
game-inactivity:
  enabled: ${GAME_INACTIVITY_ENABLED:true}
  idle-period: ${GAME_INACTIVITY_IDLE_PERIOD:30d}
  grace-period: ${GAME_INACTIVITY_GRACE_PERIOD:3d}
  poll-delay: ${GAME_INACTIVITY_POLL_DELAY:15m}
  batch-size: ${GAME_INACTIVITY_BATCH_SIZE:50}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logbook:
  format:
    style: json
  obfuscate:
    headers:
      - Authorization
      - X-Service-Token
      - Cookie
      - Set-Cookie
    parameters:
      - inviteCode
    json-body-fields:
      - inviteCode
      - characterSheetUrl
      - birthYear
      - gender
      - about
      - reason
      - webhookUrl
      - telegramChatId
      - vkGroupId
  write:
    max-body-size: 8192
  exclude:
    - /actuator/health
    - /v3/api-docs/**
    - /swagger-ui/**

logging:
  level:
    org.zalando.logbook: TRACE

# Необязательный отдельный AES-256 ключ; по умолчанию используется производный ключ авторизации.
discord-publications:
  encryption-key: ${DISCORD_WEBHOOK_ENCRYPTION_KEY:}
  site-url: ${DISCORD_PUBLICATION_SITE_URL:https://new.ttg.club}
  # Сайты, с которых разрешено брать картинки каналов, кроме site-url: у стендов отдельные хранилища.
  image-hosts: ${PUBLICATION_IMAGE_HOSTS:}

# Тот же бот, что в core-api; ID каналов задаются через админку и шифруются в базе.
telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:}

# Те же ключ и сообщество, что в core-api; ID из админки заменяет VK_GROUP_ID и шифруется в базе.
vk:
  access-token: ${VK_ACCESS_TOKEN:}
  group-id: ${VK_GROUP_ID:}
