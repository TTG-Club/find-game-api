services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: find_game
      POSTGRES_USER: find_game
      POSTGRES_PASSWORD: find_game
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U find_game -d find_game"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - find-game-postgres:/var/lib/postgresql/data

volumes:
  find-game-postgres:
